on:
  workflow_dispatch:
  push:
    branches: main
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'

name: Quarto render & publish on GH Pages

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

# 1. Install R on the runner
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

  # 2. (Recommended) Install required R packages used in your .qmd files
      - uses: r-lib/actions/setup-r-dependencies@v2

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render and Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
